<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TFSystem</title>
    <style>
      :root { color-scheme: dark; background: #0b0c0d; }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body { margin: 0; background: #0b0c0d; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      main { min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; overflow: hidden; }
      .brand-stack { display: flex; flex-direction: column; gap: .08rem; width: min(100%, 28rem); text-align: center; }
      .brand-line { display: block; font-size: clamp(1.35rem, 4vw, 2.5rem); font-weight: 500; letter-spacing: .02em; line-height: 1.02; }
      .brand-line strong {
        font-weight: inherit;
        background: linear-gradient(112deg, #7a3015 0%, #bd6230 18%, #ffd2a3 38%, #e28a4d 52%, #8b3919 76%, #f1a36b 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent !important;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 .02em rgba(255, 194, 138, .22);
      }
      @media (max-width: 480px) { .brand-stack { gap: .04rem; } .brand-line { font-size: clamp(1.2rem, 8vw, 2rem); } }
    </style>
  </head>
